[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-crossover-analysis"
version = "0.1.0"
description = "Analysis of emotion induction and working memory crossover experiment"
requires-python = ">=3.11"

[tool.setuptools]
packages = [
    "src",
    "src.models",
    "src.visualization"
]